name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore WhatsAppMonitorAssistant.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format WhatsAppMonitorAssistant.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build WhatsAppMonitorAssistant.slnx --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/Unit.Tests --no-build --logger "console;verbosity=normal"

      - name: Architecture tests
        run: dotnet test tests/Architecture.Tests --no-build --logger "console;verbosity=normal"

      - name: Contract tests
        run: dotnet test tests/Contract.Tests --no-build --logger "console;verbosity=normal"

      # ---------------------------------------------------------------------
      # Future gates: placeholders only.
      #
      # The remaining entries below are not enabled. They are extension points
      # so that no gate is ever reported as passing while it does not exist.
      #
      # Required gate                Status / owner                         Step to add
      # E2E.Tests                    deferred - Fast Track (TECHNICAL 36.3) dotnet test tests/E2E.Tests --no-build
      # Playwright critical smoke    deferred - Fast Track (TECHNICAL 36.3) npx playwright test
      # Coverage (>=80% Domain/App)  CI expansion                           dotnet test ... --collect:"XPlat Code Coverage" + threshold check
      # Vulnerability scan           CI expansion                           dotnet list package --vulnerable --include-transitive
      # Docker image build           pilot work (post-acceptance)           docker build
      #
      # Contract.Tests is not a future gate: the Meta webhook and outbound contract fixtures of
      # #13 ship inside the enabled "Contract tests" step above alongside the Ollama fixtures of
      # #10, so they need no step of their own.
      #
      # ---------------------------------------------------------------------

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore WhatsAppMonitorAssistant.slnx --locked-mode

      - name: Build Integration.Tests (warnings as errors)
        run: dotnet build tests/Integration.Tests --no-restore -warnaserror

      - name: Integration tests
        run: dotnet test tests/Integration.Tests --no-build --logger "console;verbosity=normal"
